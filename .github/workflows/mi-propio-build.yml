name: .NET Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET Personalizado
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x # Cambia esto a la versión que uses (ej. 6.0, 9.0)

    - name: Restore dependencies Personalizado
      run: dotnet restore

    - name: Build Personalizado
      run: dotnet build --no-restore --configuration Release

    - name: Test personalizado
      run: dotnet test --no-build --verbosity normal